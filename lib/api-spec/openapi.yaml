openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: family
    description: Guardian family accounts, learner profiles, and progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: Get the signed-in guardian's family
      responses:
        "200":
          description: Guardian family profiles and learner progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianFamily"
        "401":
          description: Sign-in required
  /family/children:
    post:
      operationId: createChildProfile
      tags: [family]
      summary: Create a learner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildProfileInput"
      responses:
        "201":
          description: Learner profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildProfile"
        "400":
          description: Invalid profile name
        "401":
          description: Sign-in required
  /family/children/{childId}:
    delete:
      operationId: deleteChildProfile
      tags: [family]
      summary: Delete a learner profile and its progress
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Learner profile deleted
        "401":
          description: Sign-in required
        "404":
          description: Learner profile not found
  /family/children/{childId}/age-band:
    patch:
      operationId: updateChildAgeBand
      tags: [family]
      summary: Update the learner's recommended age-band path
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgeBandInput"
      responses:
        "200":
          description: Updated age-band recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeBandResponse"
        "400":
          description: Invalid age band
        "401":
          description: Sign-in required
        "404":
          description: Learner profile not found
  /family/children/{childId}/daily-usage:
    get:
      operationId: getChildDailyUsage
      tags: [family]
      summary: Get active learning time remaining in the learner's 24-hour window
      parameters:
        - { name: childId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Server-calculated daily learning time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyUsage" }
        "401": { description: Sign-in required }
        "404": { description: Learner profile not found }
    post:
      operationId: recordChildDailyUsage
      tags: [family]
      summary: Start, pause, or record active learning time
      parameters:
        - { name: childId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyUsageHeartbeat" }
      responses:
        "200":
          description: Updated server-calculated daily learning time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyUsage" }
        "401": { description: Sign-in required }
        "404": { description: Learner profile not found }
  /family/children/{childId}/quiz:
    post:
      operationId: startLearningQuiz
      tags: [family]
      parameters:
        - { name: childId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartQuizInput"
      responses:
        "200":
          description: Randomized server-owned quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttempt"
  /family/children/{childId}/review-quiz:
    post:
      operationId: submitReviewQuiz
      tags: [family]
      parameters:
        - { name: childId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewQuizInput"
      responses:
        "200":
          description: Review grade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizGrade" }
  /family/children/{childId}/lessons/{lessonId}/review:
    post:
      operationId: recordLessonReview
      tags: [family]
      parameters:
        - { name: childId, in: path, required: true, schema: { type: string } }
        - { name: lessonId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Missed lesson reviewed }
  /family/children/{childId}/progress:
    post:
      operationId: completeChildLesson
      tags: [family]
      summary: Save a completed lesson for a learner
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonProgressInput"
      responses:
        "200":
          description: Updated learner progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgress"
        "401":
          description: Sign-in required
        "404":
          description: Learner profile not found
  /family/children/{childId}/learning-state:
    patch:
      operationId: updateChildLearningState
      tags: [family]
      summary: Save guardian-owned learning goals, pledges, and project approvals
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningState"
      responses:
        "200":
          description: Updated family learning state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningState"
        "401":
          description: Sign-in required
        "404":
          description: Learner profile not found
  /family/children/{childId}/lessons/{lessonId}/talk:
    patch:
      operationId: markLessonTalkDiscussed
      tags: [family]
      summary: Mark a lesson's family conversation as discussed
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation discussion timestamp
          content:
            application/json:
              schema:
                type: object
                required: [talkDiscussedAt]
                properties:
                  talkDiscussedAt: { type: string, format: date-time }
        "401":
          description: Sign-in required
        "404":
          description: Completed lesson not found
  /family/children/{childId}/assessments:
    post:
      operationId: submitLevelAssessment
      tags: [family]
      summary: Submit a level assessment for server-side grading
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelAssessmentInput"
      responses:
        "200":
          description: Assessment result and earned levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelAssessmentResult"
        "401":
          description: Sign-in required
        "403":
          description: Finish the required lessons and prior level first
        "404":
          description: Learner profile not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChildProfile:
      type: object
      required: [id, displayName, ageBand, completedLessonIds, masteredLevelIds, learningState, lessonRecords, learningScore, scoreBreakdown, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        ageBand:
          type: ["string", "null"]
          enum: ["10-12", "13-15", "16-plus", null]
        completedLessonIds:
          type: array
          items: { type: string }
        masteredLevelIds:
          type: array
          items: { type: string }
        learningState:
          $ref: "#/components/schemas/LearningState"
        lessonRecords:
          type: array
          items:
            $ref: "#/components/schemas/LessonRecord"
        reviewCount: { type: integer }
        bestReviewScore: { type: integer }
        weakTopics:
          type: array
          items:
            type: object
            required: [lessonId, misses]
            properties:
              lessonId: { type: string }
              misses: { type: integer }
        levelScores:
          type: object
          additionalProperties: { type: integer }
        learningScore: { type: integer, minimum: 0 }
        scoreBreakdown:
          type: object
          required: [missionPoints, quizPoints, chapterPoints, reviewPoints]
          properties:
            missionPoints: { type: integer, minimum: 0 }
            quizPoints: { type: integer, minimum: 0 }
            chapterPoints: { type: integer, minimum: 0 }
            reviewPoints: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ChildProfileInput:
      type: object
      required: [displayName, ageBand]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
        ageBand:
          $ref: "#/components/schemas/AgeBand"
    AgeBand:
      type: string
      enum: ["10-12", "13-15", "16-plus"]
    AgeBandInput:
      type: object
      required: [ageBand]
      properties:
        ageBand:
          $ref: "#/components/schemas/AgeBand"
    AgeBandResponse:
      type: object
      required: [ageBand]
      properties:
        ageBand:
          $ref: "#/components/schemas/AgeBand"
    GuardianFamily:
      type: object
      required: [children, testingAdmin]
      properties:
        children:
          type: array
          items: { $ref: "#/components/schemas/ChildProfile" }
        testingAdmin: { type: boolean }
    LessonProgressInput:
      type: object
      required: [lessonId, reflection, durationSeconds, activityCompleted, watchCompleted, attemptId, answers, activityEvidence]
      properties:
        lessonId:
          type: string
        attemptId: { type: string }
        answers: { $ref: "#/components/schemas/QuizAnswers" }
        activityEvidence: { type: string, minLength: 10, maxLength: 8000 }
        reflection: { type: string, minLength: 30, maxLength: 2000 }
        durationSeconds: { type: integer, minimum: 1, maximum: 7200 }
        quizScore: { type: integer, minimum: 0, maximum: 100 }
        activityCompleted: { type: boolean, const: true }
        watchCompleted: { type: boolean, const: true }
    LessonRecord:
      type: object
      required: [lessonId, durationSeconds]
      properties:
        lessonId: { type: string }
        reflection: { type: ["string", "null"] }
        durationSeconds: { type: integer }
        quizScore: { type: ["integer", "null"] }
        talkDiscussedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: string, format: date-time }
    LearningState:
      type: object
      required: [weeklyGoal, pledgeLevel, learnerAgreedLevel, projects]
      properties:
        revision: { type: integer, minimum: 0 }
        weeklyGoal: { type: integer, minimum: 1, maximum: 7 }
        pledgeLevel: { type: integer, minimum: 0, maximum: 4 }
        learnerAgreedLevel: { type: integer, minimum: 0, maximum: 4 }
        projects:
          type: object
          additionalProperties:
            type: object
            properties:
              content: { type: string, maxLength: 4000 }
              approved: { type: boolean }
              reviewedAt: { type: ["string", "null"], format: date-time }
              rubric:
                type: array
                items: { type: boolean }
    LessonProgress:
      type: object
      required: [completedLessonIds]
      properties:
        completedLessonIds:
          type: array
          items: { type: string }
    LevelAssessmentInput:
      type: object
      required: [levelId, attemptId, answers]
      properties:
        levelId:
          type: string
          enum: [ai-foundations, responsible-use, prompt-craft, app-builder]
        attemptId: { type: string }
        answers:
          $ref: "#/components/schemas/QuizAnswers"
    LevelAssessmentResult:
      type: object
      required: [levelId, score, passed, masteredLevelIds]
      properties:
        levelId:
          type: string
          enum: [ai-foundations, responsible-use, prompt-craft, app-builder]
        score: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        masteredLevelIds:
          type: array
          items: { type: string }
        missedLessonIds: { type: array, items: { type: string } }
        feedback: { type: array, items: { type: string } }
    StartQuizInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [lesson, level, review] }
        targetId: { type: string }
    ReviewQuizInput:
      type: object
      required: [attemptId, answers]
      properties:
        attemptId: { type: string }
        answers: { $ref: "#/components/schemas/QuizAnswers" }
    QuizAnswers:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: array
        minItems: 1
        maxItems: 12
        items: { type: integer, minimum: 0, maximum: 20 }
    QuizAttempt:
      type: object
      required: [attemptId, questions]
      properties:
        attemptId: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [id, lessonId, type, prompt, options]
            properties:
              id: { type: string }
              lessonId: { type: string }
              type: { type: string, enum: [choice, order, sort] }
              prompt: { type: string }
              options: { type: array, items: { type: string } }
    QuizGrade:
      type: object
      required: [score, passed, missedLessonIds, feedback]
      properties:
        score: { type: integer }
        passed: { type: boolean }
        missedLessonIds: { type: array, items: { type: string } }
        feedback: { type: array, items: { type: string } }
    DailyUsageHeartbeat:
      type: object
      required: [active, sessionId]
      properties:
        active: { type: boolean }
        sessionId: { type: string, format: uuid }
    DailyUsage:
      type: object
      required: [usedSeconds, remainingSeconds, resetAt]
      properties:
        usedSeconds: { type: integer, minimum: 0, maximum: 600 }
        remainingSeconds: { type: integer, minimum: 0, maximum: 600 }
        resetAt: { type: string, format: date-time }

